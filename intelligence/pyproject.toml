[project]
name = "threshold-intelligence"
version = "0.1.0"
description = "Threshold research pipelines: signal processing, gesture recognition, baselines and recovery modelling."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.1"]
deep = ["torch>=2.4"]
export = ["coremltools>=8.0", "onnx>=1.16", "skl2onnx>=1.17"]
tracking = ["mlflow>=2.15"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# The intelligence/ directory itself is the `threshold_intelligence` package, keeping the
# repository layout (intelligence/signal_processing, intelligence/training, ...).
[tool.setuptools]
package-dir = { "threshold_intelligence" = "." }
packages = [
    "threshold_intelligence",
    "threshold_intelligence.signal_processing",
    "threshold_intelligence.gesture_detection",
    "threshold_intelligence.activity_classification",
    "threshold_intelligence.baseline_engine",
    "threshold_intelligence.consumption_engine",
    "threshold_intelligence.recovery_prediction",
    "threshold_intelligence.intervention_engine",
    "threshold_intelligence.personalization",
    "threshold_intelligence.training",
    "threshold_intelligence.evaluation",
    "threshold_intelligence.datasets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["artifacts", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = ["B008"]
