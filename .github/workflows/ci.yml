name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (packages + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: threshold
          POSTGRES_PASSWORD: threshold
          POSTGRES_DB: threshold_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threshold" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://threshold:threshold@localhost:5432/threshold_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Migrations apply, match the models, and roll back
        env:
          THRESHOLD_ENV: development
          THRESHOLD_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -q

  intelligence:
    name: Intelligence (Python ML)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: intelligence/pyproject.toml
      # torch / coremltools extras are intentionally not installed in CI; deep model families
      # report "not_run" and export tests exercise the refusal paths only.
      - run: pip install -e ".[dev,boosting]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest -q

  watch-core:
    name: watchOS core logic (swift test)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/watch
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
