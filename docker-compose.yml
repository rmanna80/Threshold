# Local development stack for the optional Threshold backend.
# Usage:  docker compose up -d db redis && docker compose run --rm migrate && docker compose up api
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threshold
      POSTGRES_PASSWORD: threshold
      POSTGRES_DB: threshold
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threshold"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      THRESHOLD_DATABASE_URL: postgresql+psycopg://threshold:threshold@db:5432/threshold
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]

  api:
    build: ./backend
    env_file: .env
    environment:
      THRESHOLD_DATABASE_URL: postgresql+psycopg://threshold:threshold@db:5432/threshold
      THRESHOLD_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
