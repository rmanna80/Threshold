[project]
name = "threshold-backend"
version = "0.1.0"
description = "Optional sync, account and research API for Threshold (Comeback Technologies LLC)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16",
    "email-validator>=2.4",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "argon2-cffi>=25.1",
    "pyjwt>=2.15",
    "cryptography>=50",
    "redis>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-cov>=7", "httpx>=0.29", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
ignore_missing_imports = true
exclude = ["migrations/"]
